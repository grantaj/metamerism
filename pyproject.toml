[project]
name = "metamerism"
version = "0.1.0"
description = "Tools for exploring metameric paint-light systems."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alex Grant" }
]
dependencies = [
    "colour-science>=0.4.6",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "streamlit>=1.58.0",
]

[project.scripts]
metamerism = "metamerism.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a0",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]
data = [
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamerism"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
